services:
  - type: web
    name: ai-resume-analyzer-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENABLE_HF_MODEL
        value: "false"
      - key: HF_MODEL_NAME
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: ALLOW_LLM_FALLBACK
        value: "true"
      - key: FRONTEND_ORIGIN
        sync: false
